[package]
name = "iureocr"
version = "0.5.1"
description = "OCR local con Tesseract y herramientas PDF conectadas a Iurefficient"
authors = ["Iurefficient"]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"

[lib]
name = "iureocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# Rasteriza las páginas de un PDF para pasárselas a Tesseract (biblioteca pdfium
# dinámica, descargada por scripts/descargar-pdfium.py).
# `thread_safe`: pdfium sólo se enlaza una vez por proceso; con esta función el
# manejador es Send+Sync y lo comparten el OCR y las miniaturas.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
image = "0.25"
# Manipulación de páginas (quitar, conservar, rotar) sin dependencias nativas.
lopdf = "0.45"
base64 = "0.22"
# Prueba: testado y numeración Bates con el motor de PdfCraft (MIT OR Apache-2.0).
# Sin versión en crates.io y con cambios diarios: fijado a un commit concreto.
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "0a0986483378b57d62103a36490bd66166d32c8f" }
pdfcraft-model = { git = "https://github.com/storytold/pdfcraft", rev = "0a0986483378b57d62103a36490bd66166d32c8f" }
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "0a0986483378b57d62103a36490bd66166d32c8f" }
pdfcraft-redact = { git = "https://github.com/storytold/pdfcraft", rev = "0a0986483378b57d62103a36490bd66166d32c8f" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "0a0986483378b57d62103a36490bd66166d32c8f" }
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.7.1" }

# En `tauri dev`, las dependencias (pdfium-render, image, PdfCraft…) van optimizadas: sin
# esto, testar una página escaneada tarda unas diez veces más que en la versión publicada.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
