[package]
name = "iureocr"
version = "0.3.3"
description = "OCR local con Tesseract y herramientas PDF conectadas a Iurefficient"
authors = ["Iurefficient"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "iureocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
# Rasteriza las páginas de un PDF para pasárselas a Tesseract (biblioteca pdfium
# dinámica, descargada por scripts/descargar-pdfium.py).
# `thread_safe`: pdfium sólo se enlaza una vez por proceso; con esta función el
# manejador es Send+Sync y lo comparten el OCR y las miniaturas.
pdfium-render = { version = "0.9", features = ["thread_safe"] }
image = "0.25"
# Manipulación de páginas (quitar, conservar, rotar) sin dependencias nativas.
lopdf = "0.45"
base64 = "0.22"
iurefficient-connect = { git = "https://github.com/ellaguno/iurefficient-connect", tag = "v0.5.2" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
