name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
            pdfium: linux-x64
            orden: 3
          - name: windows-x64
            os: windows-latest
            args: ""
            pdfium: win-x64
            orden: 1
          - name: macos-universal
            os: macos-latest
            args: "--target universal-apple-darwin"
            pdfium: mac-univ
            orden: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Dependencias de Linux (Tauri y Tesseract)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libsoup-3.0-dev tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng

      - run: npm ci

      - name: pdfium y modelos de idioma
        run: |
          python3 scripts/descargar-pdfium.py --objetivo ${{ matrix.pdfium }}
          python3 scripts/descargar-tessdata.py

      - name: Tesseract para Windows (incluido en el instalador)
        if: startsWith(matrix.os, 'windows')
        run: python3 scripts/descargar-tesseract-windows.py

      - name: Compilar y empaquetar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      # --- Paquete MSIX para Microsoft Store (Windows) ------------------------------
      # Lo mismo que instala el NSIS (IureOCR.exe + resources\: pdfium, Tesseract y los
      # modelos spa/eng/osd) con el manifiesto de assets/windows/msix. Dos artefactos, que
      # no van a la release: `msix-store` (sin firmar, para Partner Center; la Store lo
      # firma) y `msix-prueba` (firmado con un certificado de prueba, más su .cer).
      - name: Paquete MSIX (Microsoft Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MSIX_IDENTITY_NAME -or -not $env:MSIX_PUBLISHER -or -not $env:MSIX_PUBLISHER_DISPLAY_NAME) {
            Write-Output "::warning::Faltan las variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER o MSIX_PUBLISHER_DISPLAY_NAME: el .msix lleva una identidad de prueba y Partner Center lo rechazará."
          }
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { 'Iurefficient.IureOCR' }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { 'CN=Iurefficient' }
          $display = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { 'Iurefficient' }
          # La Store no acepta un primer número 0 y exige el cuarto en 0: 0.6.1 → 1.6.1.0
          # (mismo esquema que Iurefficient Apps e IureProject). La 1.0.0 será 2.0.0.0.
          $app = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $parts = ($app -replace '-.*$', '').Split('.')
          $version = "$([int]$parts[0] + 1).$($parts[1]).$($parts[2]).0"
          Write-Output "Versión de la app: $app · versión del paquete: $version"
          # Los valores van dentro de atributos XML.
          $identity = [System.Security.SecurityElement]::Escape($identity)
          $publisher = [System.Security.SecurityElement]::Escape($publisher)
          $display = [System.Security.SecurityElement]::Escape($display)

          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^10\.' -and (Test-Path "$($_.FullName)\x64\makeappx.exe") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $tools = "$($sdk.FullName)\x64"
          Write-Output "Windows SDK: $tools"

          $root = 'msix\paquete'
          New-Item -ItemType Directory -Force $root, msix\store, msix\prueba | Out-Null
          Copy-Item -Recurse assets\windows\msix\Assets "$root\Assets"
          # Como en el NSIS: el ejecutable con el nombre del producto y resources\ al lado.
          Copy-Item src-tauri\target\release\iureocr.exe "$root\IureOCR.exe"
          Copy-Item -Recurse src-tauri\resources "$root\resources"
          foreach ($f in 'resources\tesseract\tesseract.exe', 'resources\tessdata\spa.traineddata', 'resources\tessdata\eng.traineddata', 'resources\pdfium\pdfium.dll') {
            if (-not (Test-Path "$root\$f")) { Write-Output "::error::Falta $f en el paquete MSIX"; exit 1 }
          }
          $manifest = Get-Content assets\windows\msix\AppxManifest.xml -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', $identity).Replace('@PUBLISHER@', $publisher)
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', $display).Replace('@VERSION@', $version)
          [xml]$manifest | Out-Null  # falla aquí, con un mensaje claro, si el XML no es válido
          Set-Content "$root\AppxManifest.xml" $manifest -Encoding utf8

          # resources.pri: elige los iconos sin fondo (altform-unplated) de la barra de tareas.
          & "$tools\makepri.exe" createconfig /cf msix\priconfig.xml /dq es-MX /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makepri.exe" new /pr $root /cf msix\priconfig.xml /mn "$root\AppxManifest.xml" /of "$root\resources.pri" /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$tools\makeappx.exe" pack /d $root /p msix\store\iureocr-windows-x64.msix /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copia de prueba: certificado autofirmado con el mismo Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature `
            -FriendlyName 'IureOCR (prueba)' -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pass = ConvertTo-SecureString -String 'prueba' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath msix\prueba.pfx -Password $pass | Out-Null
          Export-Certificate -Cert $cert -FilePath msix\prueba\iureocr-prueba.cer | Out-Null
          Copy-Item msix\store\iureocr-windows-x64.msix msix\prueba\iureocr-windows-x64-prueba.msix
          & "$tools\signtool.exe" sign /fd SHA256 /f msix\prueba.pfx /p prueba msix\prueba\iureocr-windows-x64-prueba.msix
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item msix\prueba.pfx

          # Prueba: instalar la copia firmada, hacer OCR por MCP con el alias y desinstalar.
          Import-Certificate -FilePath msix\prueba\iureocr-prueba.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path msix\prueba\iureocr-windows-x64-prueba.msix
          $pkg = Get-AppxPackage | Where-Object { $_.Name -eq $identity } | Select-Object -First 1
          Write-Output "Instalado: $($pkg.PackageFullName) en $($pkg.InstallLocation)"
          $ok = $true
          try {
            & pwsh -NoProfile -File scripts\probar-msix.ps1 -Alias "$env:LOCALAPPDATA\Microsoft\WindowsApps\iureocr.exe" -Dir "$env:RUNNER_TEMP\iureocr-msix-prueba"
            if ($LASTEXITCODE -ne 0) { $ok = $false }
          } finally {
            Remove-AppxPackage -Package $pkg.PackageFullName
          }
          if (-not $ok) { Write-Output "::error::La prueba de OCR dentro del paquete MSIX falló"; exit 1 }
          Get-ChildItem msix\store, msix\prueba | Format-Table Name, Length

      - name: Subir el MSIX para la Store
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-store
          path: msix/store/*

      - name: Subir el MSIX de prueba
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: msix-prueba
          path: msix/prueba/*

      # El actualizador instala el paquete del mismo tipo que la app (una instalación
      # .deb no acepta un AppImage), así que el .deb y el .rpm también llevan firma.
      - name: Firmar .deb y .rpm para el actualizador
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' \) -print | while read -r f; do
            [ -f "$f.sig" ] || npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$f"
          done

      # --- Firma Authenticode (Windows) con SignPath -------------------------------
      # Solo en releases y solo cuando existen el token (secreto SIGNPATH_API_TOKEN) y
      # las variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y
      # SIGNPATH_SIGNING_POLICY_SLUG. Sin ellos se publica sin firmar.
      - name: Instaladores de Windows por firmar
        id: sin_firmar
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          mkdir -p sin-firmar
          find src-tauri/target -path '*/release/bundle/*' -type f \( -name '*-setup.exe' -o -name '*.msi' \) -exec cp {} sin-firmar/ \;
          ls -la sin-firmar
          echo "hay=$(ls sin-firmar | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Subir los instaladores como artefacto para SignPath
        id: artefacto_sin_firmar
        if: steps.sin_firmar.outputs.hay != '' && steps.sin_firmar.outputs.hay != '0'
        uses: actions/upload-artifact@v4
        with:
          name: sin-firmar-${{ matrix.name }}
          path: sin-firmar/*
          retention-days: 3

      - name: Firmar con SignPath
        id: signpath
        if: steps.artefacto_sin_firmar.outputs.artifact-id != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.artefacto_sin_firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmados

      - name: Sustituir por los firmados y rehacer la firma del actualizador
        if: steps.signpath.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          n=0
          for firmado in $(find firmados -type f \( -name '*.exe' -o -name '*.msi' \)); do
            nombre="$(basename "$firmado")"
            destino="$(find src-tauri/target -path '*/release/bundle/*' -type f -name "$nombre" | head -1)"
            if [ -z "$destino" ]; then
              echo "::error::SignPath devolvió $nombre pero no existe en el bundle"
              exit 1
            fi
            cp "$firmado" "$destino"
            if [ -f "$destino.sig" ]; then
              npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$destino"
            fi
            n=$((n + 1))
          done
          echo "$n instaladores firmados"

      # Nombre uniforme: IureOCR_<versión>_<orden>-<plataforma>.<ext>. GitHub lista los
      # assets por nombre, así que el prefijo deja Windows, macOS y Linux en ese orden.
      - name: Renombrar instaladores
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist-release
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' -o -name '*.msi.sig' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*.deb.sig' -o -name '*.rpm.sig' \) \
            -print | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.app.tar.gz.sig) ext="app.tar.gz.sig" ;;
              *.app.tar.gz)     ext="app.tar.gz" ;;
              *.AppImage.sig)   ext="AppImage.sig" ;;
              *-setup.exe.sig)  ext="exe.sig" ;;
              *.msi.sig)        ext="msi.sig" ;;
              *.deb.sig)        ext="deb.sig" ;;
              *.rpm.sig)        ext="rpm.sig" ;;
              *)                ext="${base##*.}" ;;
            esac
            cp "$f" "dist-release/IureOCR_${VERSION}_${{ matrix.orden }}-${{ matrix.name }}.${ext}"
          done
          ls -la dist-release

      - name: Publicar en la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "IureOCR $TAG" --notes-file .github/release-notes.md || true
          gh release upload "$TAG" dist-release/* --clobber

      - name: Publicar artefactos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: iureocr-${{ matrix.name }}
          if-no-files-found: ignore
          path: dist-release/*

  # Manifiesto del actualizador: una entrada por plataforma con las firmas de cada trabajo.
  manifest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generar latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, glob, datetime
          tag = os.environ["GITHUB_REF_NAME"]; version = tag.lstrip("v")
          base = f"https://github.com/ellaguno/iureocr/releases/download/{tag}/"
          # nombre de plataforma en los archivos → claves del actualizador (os-arch)
          targets = {
            "linux-x64": ["linux-x86_64"],
            "windows-x64": ["windows-x86_64"],
            "macos-universal": ["darwin-aarch64", "darwin-x86_64"],
          }
          platforms = {}
          for sig in glob.glob("artifacts/**/*.sig", recursive=True):
              name = os.path.basename(sig)
              asset = name[:-4]
              for plat, keys in targets.items():
                  if f"-{plat}." in asset:
                      # Preferido por plataforma: AppImage en Linux, .exe en Windows, .app.tar.gz en macOS.
                      pref = {"linux-x64": ".AppImage", "windows-x64": ".exe", "macos-universal": ".app.tar.gz"}[plat]
                      if not asset.endswith(pref):
                          continue
                      for k in keys:
                          platforms[k] = {"url": base + asset, "signature": open(sig).read().strip()}
              # Claves por instalador ({os}-{arch}-{tipo}): el actualizador las prefiere a
              # {os}-{arch}, así una instalación .deb/.rpm recibe su propio paquete.
              for ext, key in ((".deb", "linux-x86_64-deb"), (".rpm", "linux-x86_64-rpm")):
                  if asset.endswith(ext) and "-linux-x64." in asset:
                      platforms[key] = {"url": base + asset, "signature": open(sig).read().strip()}
          manifest = {"version": version, "notes": f"IureOCR {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}
          json.dump(manifest, open("latest.json", "w"), indent=2, ensure_ascii=False)
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
